name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Generate types and check formatting, lint, and types
        run: vp run check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build project
        run: vp run build

      - name: Check types
        run: vp run types:check

      - name: Enforce lint after generated builds
        run: vp run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run tests
        run: vp run test

  deploy:
    # Only run on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Wait for all CI jobs to pass before deploying
    needs: [lint, build, test]
    runs-on: ubuntu-latest
    env:
      VITE_STRIPE_PRICE_ID_FULL: price_1PP5qhJ3Pt748JzgIsCiWawn
      VITE_STRIPE_PRICE_ID_FLEX: price_1PP5q9J3Pt748Jzg2wLlJ0jB
      VITE_CF_TURNSTILE_SITE_KEY: "0x4AAAAAACH5P-GjR3rNGHEa"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build project
        run: vp run build

      - name: Run database migrations
        working-directory: apps/web
        env:
          PG_DATABASE_URL: ${{ secrets.PG_DATABASE_URL }}
        run: vp run db:postgres:migrate

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: pnpm
